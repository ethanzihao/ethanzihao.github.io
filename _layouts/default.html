<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.nav != 'home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f8f7f3">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Ethan Tang home"><span class="brand-mark" aria-hidden="true">et.</span><span>Ethan Tang<span class="brand-subtitle">A PERSONAL NOTEBOOK</span></span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.nav == 'archive' %}aria-current="page"{% endif %}>Archive</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>About</a>
        <a class="github-link" href="https://github.com/ethanzihao">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer"><span>© {{ site.time | date: '%Y' }} Ethan Tang<span class="footer-note"> · Stay curious. Keep thinking.</span></span><a href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a></footer>
  </div>
</body>
</html>
